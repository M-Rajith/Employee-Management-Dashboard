server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: peopleos
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/peopleos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

peopleos:
  annual-leave-quota: 18
