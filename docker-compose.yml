# PeopleOS — full stack with one command:  docker compose up --build
# MySQL 8 + Spring Boot backend + React frontend (nginx)
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: peopleos
      MYSQL_USER: peopleos
      MYSQL_PASSWORD: peopleos123
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-upeopleos", "-ppeopleos123" ]
      interval: 5s
      timeout: 3s
      retries: 24

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/peopleos?useSSL=false&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: peopleos
      DATABASE_PASSWORD: peopleos123
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql-data:
